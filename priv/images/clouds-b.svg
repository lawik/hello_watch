    <radialGradient id="c0" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.500"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.225"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.500"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.225"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.200"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.090"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c3" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.350"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.158"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c4" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.350"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.158"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="400.0" cy="70.0" rx="250.0" ry="200.0" fill="url(#c0)"/>
  <ellipse cx="60.0" cy="400.0" rx="270.0" ry="210.0" fill="url(#c1)"/>
  <ellipse cx="200.0" cy="300.0" rx="200.0" ry="140.0" fill="url(#c2)"/>
  <ellipse cx="-110.0" cy="110.0" rx="190.0" ry="170.0" fill="url(#c3)"/>
  <ellipse cx="580.0" cy="360.0" rx="210.0" ry="180.0" fill="url(#c4)"/>

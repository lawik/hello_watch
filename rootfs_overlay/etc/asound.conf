# ALSA's default device is the watch's speaker and mic (see
# HelloWatch.Audio), so programs that only know the default (PortAudio, as
# home_base's mic and speaker use) play and record through them.
pcm.!default {
  type asym
  playback.pcm "speaker"
  capture.pcm "mic"
}

# The amp has no speaker protection running, so playback is scaled to half
# of full scale. The card takes 48 kHz 16-bit stereo; plug converts the rest.
pcm.speaker {
  type plug
  slave.pcm "speaker_half"
}

pcm.speaker_half {
  type route
  slave {
    pcm "hw:mobvoirover,0"
    channels 2
  }
  ttable.0.0 0.5
  ttable.1.1 0.5
}

# The digital mic is on the left channel of the capture device; a mono
# recording mixes in the silent right one, 6 dB down.
pcm.mic {
  type plug
  slave.pcm "hw:mobvoirover,1"
}

ctl.!default {
  type hw
  card 0
}
